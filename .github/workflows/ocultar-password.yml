name: Ocultar contraseña en soluciones.html

on:
  workflow_dispatch:

jobs:
  reemplazar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reemplazar script inline por auth.js
        run: |
          find . -name "soluciones.html" -print0 | while IFS= read -r -d '' file; do
            echo "Procesando: $file"
            perl -0pi -e 's{<script>\s*function verificarPassword[\s\S]*?</script>}{<script src="/Mi-Blogs-de-Matem-ticas-/auth.js"></script>}gs' "$file"
          done

      - name: Verificar que no quede pnfe2026
        run: |
          if grep -rn "pnfe2026" --include="soluciones.html" . ; then
            echo "❌ Todavía hay pnfe2026 en algunos archivos"
            exit 1
          else
            echo "✅ No queda pnfe2026 en ningún soluciones.html"
          fi

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que commitear"
          else
            git commit -m "Ocultar contraseña en todos los soluciones.html (auth.js)"
            git push
          fi
